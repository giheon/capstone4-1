[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcam-pytorch"
version = "0.1.0"
description = "PyTorch implementation of Deep Clustering with Associative Memories (DCAM)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "OpenAI ChatGPT" }]
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "lightning>=2.5",
  "hydra-core>=1.3,<1.4",
  "omegaconf>=2.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pillow>=10.4",
  "matplotlib>=3.9",
  "tqdm>=4.66",
  "rich>=13.9",
]

[project.scripts]
dcam-train = "dcam.train:main"
dcam-infer = "dcam.infer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
