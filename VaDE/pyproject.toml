[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vade-pytorch"
version = "0.1.0"
description = "PyTorch implementation of Variational Deep Embedding (VaDE)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "OpenAI ChatGPT" }]
dependencies = [
  "torch>=2.6",
  "numpy>=1.26",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "pillow>=10.4",
  "rich>=13.9",
  "wandb>=0.24,<0.25",
]

[project.scripts]
vade-train = "vade.train:main"
vade-infer = "vade.infer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
