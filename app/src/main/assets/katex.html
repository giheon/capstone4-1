<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            background-color: transparent;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }
        #formula {
            text-align: center;
            color: #4B5563;
            line-height: 1.25;
            width: 100%;
            padding: 8px 12px;
        }
        .katex {
            font-size: 14px;
            white-space: normal;
        }
        .katex-display {
            margin: 0;
        }
        body.display-mode #formula {
            padding: 10px 12px;
        }
        body.display-mode .katex {
            font-size: 16px;
        }
        body.inline-mode #formula {
            padding: 0;
            width: auto;
            display: inline-block;
            line-height: 1.05;
        }
        body.inline-mode .katex {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="formula"></div>
    <script>
        function renderLatex(latex, displayMode) {
            var element = document.getElementById('formula');
            try {
                katex.render(latex, element, {
                    throwOnError: false,
                    displayMode: displayMode,
                    output: 'html'
                });
            } catch (e) {
                element.textContent = latex;
            }
        }

        var params = new URLSearchParams(window.location.search);
        var latex = params.get('latex');
        var displayMode = params.get('display') === '1';
        document.body.classList.add(displayMode ? 'display-mode' : 'inline-mode');
        if (latex) {
            renderLatex(decodeURIComponent(latex), displayMode);
        }
    </script>
</body>
</html>
